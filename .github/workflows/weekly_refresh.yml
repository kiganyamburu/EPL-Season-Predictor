name: Weekly EPL Refresh & Verification

on:
  schedule:
    - cron: "0 8 * * 2" # Every Tuesday at 08:00 UTC after the matchweek concludes
  workflow_dispatch:
    inputs:
      with_sweeps:
        description: "Re-run full 2024/25 historical backtest sweeps"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  weekly-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly data sync, injury sync, feature engineering & 10k simulations
        run: |
          if [ "${{ github.event.inputs.with_sweeps }}" = "true" ]; then
            python scripts/weekly_refresh.py --with-sweeps
          else
            python scripts/weekly_refresh.py
          fi

      - name: Verify data integrity and model tests pass before committing
        run: python -m pytest -v

      - name: Commit and push updated fixtures, features, and projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly automated EPL refresh and projections"
            git push
          fi

